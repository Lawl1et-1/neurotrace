[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotrace"
version = "0.1.0"
description = "Research prototype: learning how EEG activity relationships change over time (spatio-temporal GNN + Transformer + XAI). Not a medical device."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "mne>=1.7",
  "torch>=2.3",
  "torch_geometric>=2.5",
  "captum>=0.7",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
