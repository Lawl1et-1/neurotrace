# @package _global_
# CHB-MIT: leave-one-subject-out over the downloaded subjects, GPU.
defaults:
  - override /data: chbmit
model:
  hidden: 64
train:
  epochs: 8
  patience: 3
  seq_stride: 8
  max_batches: 200
eval:
  n_folds: null
  threshold_pct: 99.5
  adaptive_norm: 600      # causal per-recording normalisation over the last 10 minutes (DECISIONS D12)
  variants: [full, diffusion_gnn, static_graph, no_graph, no_transformer, no_var_evidence, masked_objective, supervised_head, channel_cnn_lstm]
  baseline_methods: [pearson, coherence, granger, pdc, dtf]
  baseline_every: 1
device: auto
